<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Second Loop Inc." />
    <title>Second Loop Inc.</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f7f6f2;
        color: #171717;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        margin: 0;
      }

      main {
        display: grid;
        min-height: 100svh;
        place-items: center;
        padding: 2rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 5rem);
        font-weight: 600;
        letter-spacing: -0.045em;
        line-height: 1;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello, Second Loop Inc.</h1>
    </main>
  </body>
